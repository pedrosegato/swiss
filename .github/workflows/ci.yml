name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            file

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Lint & format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # The uncomment-cli npm package ships the publisher's macOS binary and its
      # postinstall skips the download whenever bin/ is already populated, so it
      # is unusable on Linux. Fetch the pinned release build directly instead.
      # --dry-run always exits 0, so write and let git diff fail the job.
      - name: No stray comments
        env:
          UNCOMMENT_VERSION: "3.7.0"
          UNCOMMENT_SHA256: 574ba5014e3f6d4130ac861e294b1e2f606251587e2a250031d300bff0704b4a
        run: |
          archive="$RUNNER_TEMP/uncomment.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/Goldziher/uncomment/releases/download/v$UNCOMMENT_VERSION/uncomment-x86_64-unknown-linux-gnu.tar.gz"
          echo "$UNCOMMENT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/uncomment" src src-tauri/src vite.config.ts eslint.config.js
          git diff --exit-code

      - name: Build frontend
        run: pnpm vite build

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
